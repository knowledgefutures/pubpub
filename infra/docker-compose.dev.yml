name: pubpub_v6_dev

services:
    app:
        build:
            context: ..
            dockerfile: Dockerfile
            target: dev
        env_file:
            - .env.dev
        # healthcheck:
        #     test:
        #         - CMD-SHELL
        #         - >
        #             curl -f http://localhost:3000
        #     interval: 10s
        #     retries: 5
        #     start_period: 120s
        #     timeout: 3s
        environment:
            IS_DUQDUQ: ""
            NODE_ENV: development
            PORT: 3000
            DATABASE_URL: postgres://appuser:apppassword@db:5432/appdb
            CLOUDAMQP_URL: amqp://appuser:apppassword@rabbitmq:5672/appvhost
            # KF_AUTH_URL: http://kf-auth:3000
            # KF_AUTH_WEBHOOK_SECRET: dev-webhook-secret
        depends_on:
            - db
            - rabbitmq
            # - kf-auth
        ports:
            - "${WEB_PORT:-9876}:3000"
        networks: [ appnet ]
        volumes:
            - ..:/app

    worker:
        build:
            context: ..
            dockerfile: Dockerfile
            target: dev
        env_file:
            - .env.dev
        environment:
            NODE_ENV: development
            CLOUDAMQP_URL: amqp://appuser:apppassword@rabbitmq:5672/appvhost
            # KF_AUTH_URL: http://kf-auth:3000
            # KF_AUTH_WEBHOOK_SECRET: dev-webhook-secret

        command: [ "pnpm", "run", "workers-dev" ]
        depends_on:
            db:
                condition: service_started
            rabbitmq:
                condition: service_started
            # app:
            #     condition: service_healthy
        networks: [ appnet ]
        volumes:
            - ..:/app

    rabbitmq:
        image: rabbitmq:3.13-alpine
        environment:
            RABBITMQ_DEFAULT_USER: appuser
            RABBITMQ_DEFAULT_PASS: apppassword
            RABBITMQ_DEFAULT_VHOST: appvhost
        volumes:
            - rabbitmqdata:/var/lib/rabbitmq
        networks: [ appnet ]
        ports:
            - "${RABBITMQ_PORT:-5672}:5672"

    db:
        image: postgres:16
        shm_size: "2g"
        restart: always
        environment:
            - POSTGRES_USER=appuser
            - POSTGRES_PASSWORD=apppassword
            - POSTGRES_DB=appdb
        command: >
            -c shared_buffers=2GB -c effective_cache_size=6GB -c work_mem=16MB
            -c maintenance_work_mem=512MB
        volumes:
            - pgdata:/var/lib/postgresql/data
        ports:
            - "${DB_PORT:-5439}:5432"
        networks: [ appnet ]
