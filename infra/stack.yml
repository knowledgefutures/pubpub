services:
    proxy:
        image: caddy:2.11
        env_file: [.env]
        ports:
            - target: 80
              published: 80
              protocol: tcp
              mode: host
            - target: 443
              published: 443
              protocol: tcp
              mode: host
        volumes:
            - ./Caddyfile:/etc/caddy/Caddyfile:ro
            - caddy_data:/data
            - caddy_config:/config
        networks: [appnet]
        deploy:
            replicas: 1
            restart_policy:
                condition: any

    app:
        image: ghcr.io/knowledgefutures/pubpub:${IMAGE_TAG}
        env_file: [.env]
        environment:
            NODE_ENV: production
            PORT: '3000'
            APP_COMMIT: '${APP_COMMIT:-}'
            CLOUDAMQP_URL: 'amqp://appuser:apppassword@rabbitmq:5672/appvhost'
            VALKEY_URL: 'redis://valkey:6379'
        networks: [appnet]
        depends_on: [db] # note: ignored by swarm, fix later?
        healthcheck:
            test:
                - CMD-SHELL
                - >
                    node -e "require('http')
                    .get('http://127.0.0.1:3000/api/health', r => process.exit(r.statusCode < 400 ? 0 : 1))
                    .on('error', () => process.exit(1));"
            interval: 10s
            timeout: 3s
            retries: 6
            start_period: 60s
        deploy:
            replicas: 4
            update_config:
                order: start-first
                parallelism: 1
                delay: 5s
                failure_action: rollback
            rollback_config:
                order: stop-first
                parallelism: 1
            restart_policy:
                condition: on-failure

    worker:
        image: ghcr.io/knowledgefutures/pubpub:${IMAGE_TAG}
        env_file: [.env]
        environment:
            NODE_ENV: production
            APP_COMMIT: '${APP_COMMIT:-}'
            CLOUDAMQP_URL: 'amqp://appuser:apppassword@rabbitmq:5672/appvhost'
            VALKEY_URL: 'redis://valkey:6379'
        command: ['pnpm', 'run', 'workers-prod']
        networks: [appnet]
        deploy:
            replicas: 2
            update_config:
                order: start-first
                parallelism: 1
                delay: 5s
                failure_action: rollback
            restart_policy:
                condition: on-failure

    rabbitmq:
        image: rabbitmq:3.13-alpine
        environment:
            RABBITMQ_DEFAULT_USER: appuser
            RABBITMQ_DEFAULT_PASS: apppassword
            RABBITMQ_DEFAULT_VHOST: appvhost
            RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: >-
                -rabbit vm_memory_high_watermark {absolute,"350MB"}
        volumes:
            - rabbitmqdata:/var/lib/rabbitmq
        networks: [appnet]
        deploy:
            replicas: 1
            resources:
                limits:
                    memory: 512M
                reservations:
                    memory: 256M
            restart_policy:
                condition: any

    valkey:
        image: valkey/valkey:9-alpine
        volumes:
            - valkeydata:/data
        networks: [appnet]
        deploy:
            replicas: 1
            restart_policy:
                condition: any

    db:
        image: postgres:16
        tmpfs:
            - /dev/shm:size=4294967296
        environment:
            POSTGRES_USER: appuser
            POSTGRES_PASSWORD: apppassword
            POSTGRES_DB: appdb
        command: >
            -c shared_buffers=2GB
            -c effective_cache_size=6GB
            -c work_mem=16MB
            -c maintenance_work_mem=512MB
            -c max_connections=500
            -c max_wal_size=4GB
            -c min_wal_size=1GB
            -c wal_buffers=64MB
            -c checkpoint_completion_target=0.9
        volumes:
            - pgdata:/var/lib/postgresql/data
        networks: [appnet, dbaccess]
        stop_grace_period: 60s
        deploy:
            replicas: 1
            restart_policy:
                condition: any
    cron:
        image: ghcr.io/knowledgefutures/pubpub:${IMAGE_TAG}
        env_file: [.env]
        environment:
            NODE_ENV: production
            APP_COMMIT: '${APP_COMMIT:-}'
            CLOUDAMQP_URL: 'amqp://appuser:apppassword@rabbitmq:5672/appvhost'
        command: ['pnpm', 'run', 'cron']
        networks: [appnet]
        deploy:
            replicas: 1
            update_config:
                parallelism: 1
                delay: 5s
                order: start-first
                failure_action: rollback
            rollback_config:
                parallelism: 1
                order: stop-first
            restart_policy:
                condition: any

    pubstash:
        image: ghcr.io/knowledgefutures/pubpub:${IMAGE_TAG}
        env_file: [.env]
        environment:
            NODE_ENV: production
            PORT: '8080'
            MAX_CONCURRENCY: '4'
            CHROMIUM_PATH: '/usr/bin/chromium'
            CLOUDAMQP_URL: 'amqp://appuser:apppassword@rabbitmq:5672/appvhost'
        command: ['pnpm', 'run', 'pubstash-prod']
        networks: [appnet]
        healthcheck:
            test:
                - CMD-SHELL
                - 'curl -sf http://127.0.0.1:8080/ || exit 1'
            interval: 15s
            timeout: 5s
            retries: 3
            start_period: 30s
        deploy:
            replicas: 1
            update_config:
                parallelism: 1
                delay: 5s
                order: start-first
                failure_action: rollback
            rollback_config:
                parallelism: 1
                order: stop-first
            resources:
                limits:
                    memory: 2G
                reservations:
                    memory: 512M
            restart_policy:
                condition: on-failure
networks:
    appnet:
        driver: overlay
    dbaccess:
        driver: overlay
        attachable: true

volumes:
    pgdata:
    rabbitmqdata:
    valkeydata:
    caddy_data:
    caddy_config:
