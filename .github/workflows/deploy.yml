name: Deploy pubpub

run-name: >-
  ${{
    github.event_name == 'workflow_run' && format('Deploy dev: {0}', github.event.workflow_run.head_commit.message) ||
    github.event_name == 'release' && format('Deploy prod: {0}', github.event.release.tag_name) ||
    startsWith(github.ref, 'refs/tags/v') && format('Deploy prod: {0}', github.ref_name) ||
    format('Deploy dev: {0}', github.sha)
  }}

concurrency:
  group: >-
    deploy-${{
      github.event_name == 'release' && format('release-{0}', github.event.release.tag_name) ||
      github.event_name == 'workflow_run' && format('ci-{0}', github.event.workflow_run.head_branch) ||
      github.ref
    }}
  cancel-in-progress: true

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Dispatch on main deploys DuqDuq; on a v* tag, production. The console
  # hands nothing to a run on any other ref.
  workflow_dispatch:
    inputs:
      skip_ci_check:
        description: Deploy even if CI failed
        required: false
        default: false
        type: boolean
      no_cache:
        description: Build without Docker cache
        required: false
        default: false
        type: boolean
  release:
    types: [published]

permissions: {}

jobs:
  # Builds and pushes the image. It runs the repo's build and its
  # dependencies, so it gets no OIDC token: nothing here can ask the console
  # for anything.
  build:
    name: Build
    runs-on: ubuntu-latest
    # A workflow_run runs main's workflow for whatever CI run finished, a
    # fork's pull request included (its head branch can be called "main"), and
    # head_sha is that run's code: only a push to this repo's main deploys.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'release' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
      environment: ${{ steps.vars.outputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      # Production is a v* tag (a release, or a dispatch on the tag); main is
      # DuqDuq. The console checks the same ref against its deploy policy.
      - name: Set deployment vars
        id: vars
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == "release" || "$REF" == refs/tags/v* ]]; then
            image_tag="${RELEASE_TAG:-${REF#refs/tags/}}"
            environment=production
          elif [[ "$REF" == refs/heads/main ]]; then
            image_tag="$SHA"
            environment=dev
          else
            echo "::error::${REF}: dispatch on main (DuqDuq) or a v* tag (production); the console hands nothing to another ref"
            exit 1
          fi
          # It goes into the server's command line: nothing but a tag's characters.
          if [[ ! "$image_tag" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::image tag ${image_tag} has characters a deploy won't send"
            exit 1
          fi
          {
            echo "image_tag=${image_tag}"
            echo "environment=${environment}"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ./Dockerfile
          push: true
          provenance: false
          sbom: false
          no-cache: ${{ inputs.no_cache || false }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.vars.outputs.image_tag }}
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Deploys what build pushed. It runs only checkout, kf, ssh and curl: the
  # one job with an OIDC token, so the only code that can ask the console for
  # the environment's values and SSH key. It runs in the GitHub Environment
  # (dev or production) the console's deploy policy names, so it waits for
  # whatever protection that Environment has, and no run outside it gets
  # anything.
  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ needs.build.outputs.environment }}
    permissions:
      contents: read
      packages: read
      id-token: write
    env:
      ENVIRONMENT: ${{ needs.build.outputs.environment }}
      KF: npx --yes --ignore-scripts @knowledgefutures/kf@0.7.0
      KF_CONSOLE_URL: ${{ vars.KF_CONSOLE_URL || 'https://console.knowledgefutures.org' }}

    steps:
      # For infra/deploy-remote.sh at the commit being deployed.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      # The environment's SSH key into an ssh-agent, from a pipe, for an hour;
      # DEPLOY_KNOWN_HOSTS into known_hosts (no ssh-keyscan); DEPLOY_HOST,
      # DEPLOY_USER and DEPLOY_PORT, checked, as outputs. All from the console,
      # for this run.
      - name: Load the deploy key
        id: ssh
        run: $KF ci ssh-agent -e "$ENVIRONMENT"

      # The app's values go from the console to the server through this pipe:
      # never to a file here, never to one there (infra/deploy-remote.sh).
      # The first line is this job's GITHUB_TOKEN, for the server's image pull.
      - name: Deploy over SSH
        env:
          DEPLOY_USER: ${{ steps.ssh.outputs.DEPLOY_USER }}
          DEPLOY_HOST: ${{ steps.ssh.outputs.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ steps.ssh.outputs.DEPLOY_PORT }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
          REPO: ${{ github.repository }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          # Only for a server whose swarm isn't set up yet: the address to
          # advertise. A variable on the GitHub Environment, not a secret.
          SWARM_ADDR: ${{ vars.SWARM_ADDR }}
        run: |
          set -euo pipefail
          if [[ ! "$SWARM_ADDR" =~ ^[A-Za-z0-9.:_-]*$ ]]; then
            echo "::error::SWARM_ADDR has characters a deploy won't send"
            exit 1
          fi
          port=()
          if [[ -n "$DEPLOY_PORT" ]]; then port=(-p "$DEPLOY_PORT"); fi
          remote=$(base64 -w0 infra/deploy-remote.sh)
          {
            printf '%s\n' "$REGISTRY_TOKEN"
            $KF ci secrets --runtime -e "$ENVIRONMENT"
          } | ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "${port[@]}" -l "$DEPLOY_USER" -- "$DEPLOY_HOST" \
            "bash -c \"\$(echo $remote | base64 -d)\" deploy '$REPO' '$IMAGE_TAG' '$REGISTRY_USER' main '$SWARM_ADDR'"

      # From the runner, after the rollout, and as before only for production.
      # The Fastly key is the deploy's, not the app's, so it stays a GitHub
      # secret (best moved onto the production Environment) rather than a
      # console value, and is no longer on the server's command line.
      - name: Purge the cache
        if: needs.build.outputs.environment == 'production'
        env:
          CACHE_API_KEY: ${{ secrets.CACHE_API_KEY }}
          CACHE_PURGE_ALL_URL: ${{ secrets.CACHE_PURGE_ALL_URL }}
          CACHE_PURGE_HOST_URL: ${{ secrets.CACHE_PURGE_HOST_URL }}
        run: |
          set -euo pipefail
          if [[ -z "$CACHE_API_KEY" ]]; then
            echo "No CACHE_API_KEY: cache not purged"
            exit 0
          fi
          if [[ -n "$CACHE_PURGE_ALL_URL" ]]; then
            curl -fsS -X POST \
              -H "Fastly-Key: $CACHE_API_KEY" \
              -H "Fastly-Soft-Purge: 1" \
              "$CACHE_PURGE_ALL_URL"
            echo "Cache: soft purged all"
          fi
          if [[ -n "$CACHE_PURGE_HOST_URL" ]]; then
            curl -fsS -X POST \
              -H "Fastly-Key: $CACHE_API_KEY" \
              "$CACHE_PURGE_HOST_URL"
            echo "Cache: purged host"
          fi
